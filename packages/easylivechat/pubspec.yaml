name: easylivechat
# pana caps the description at 180 characters — anything longer costs the
# "valid pubspec.yaml" points and is truncated in search results anyway. The
# fuller pitch lives in README.md.
description: >-
  Headless Flutter client for EasyLiveChat real-time customer support:
  sessions, messages, attachments, typing, presence and pre/post-chat forms
  over HTTP and Socket.IO. No UI.
version: 0.1.44
homepage: https://livechattools.com
repository: https://github.com/m4hmoud/easylivechat-flutter-sdk
topics:
  - chat
  - live-chat
  - customer-support
  - messaging
  - socket-io

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter             # foundation only (ValueListenable/ChangeNotifier) — NO Material/widgets
  socket_io_client: ^3.0.0   # /widgets + /widget-presence (auth payload + query handshake)
  dio: ^5.7.0                # REST + multipart upload (onSendProgress)
  uuid: ^4.5.0               # stable per-install visitorId
  jwt_decoder: ^2.0.1        # read JWT exp locally to pre-empt 401 / handshake reject
  meta: ^1.16.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
