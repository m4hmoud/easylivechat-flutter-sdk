name: easylivechat
description: >-
  Headless Dart/Flutter client for EasyLiveChat — the real-time omni-channel
  support inbox. Speaks the anonymous widget protocol (HTTP + Socket.IO) so you
  can embed live customer support into any Flutter app. No UI; pure protocol +
  state. Pair with easylivechat_ui for prebuilt widgets.
version: 0.1.0
# Consumed via git dependency (not pub.dev).
publish_to: 'none'
homepage: https://livechattools.com
repository: https://github.com/nullsam/easylivechat

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter             # foundation only (ValueListenable/ChangeNotifier) — NO Material/widgets
  socket_io_client: ^3.0.0   # /widgets + /widget-presence (auth payload + query handshake)
  dio: ^5.7.0                # REST + multipart upload (onSendProgress)
  uuid: ^4.5.0               # stable per-install visitorId
  jwt_decoder: ^2.0.1        # read JWT exp locally to pre-empt 401 / handshake reject
  meta: ^1.16.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
