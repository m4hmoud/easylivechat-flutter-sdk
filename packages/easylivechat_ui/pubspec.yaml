name: easylivechat_ui
description: >-
  Prebuilt, themeable Flutter UI for EasyLiveChat — a launcher bubble and full
  chat screen (pre-chat form, thread, composer, attachments, CSAT, offline
  form) driven by the server widget config. Built on the headless easylivechat
  core. Embed live support in a few lines.
version: 0.1.45
homepage: https://livechattools.com
repository: https://github.com/m4hmoud/easylivechat-flutter-sdk

environment:
  # toARGB32()/withValues() require Flutter 3.27+ (Dart 3.6+).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # Hosted for consumers; in-repo development resolves the sibling via
  # pubspec_overrides.yaml (not published), so both stay in lockstep locally.
  easylivechat: ^0.1.40
  flutter_secure_storage: ^9.2.0   # default durable EasyLiveChatStorage (JWT)
  shared_preferences: ^2.3.0       # default visitorId + profile persistence
  image_picker: ^1.1.2
  file_picker: ^8.1.0
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.0             # tap-to-open links / emails / phone numbers
  # Incoming-message chime. 6.5.0 is the first release that allows this
  # package's Flutter floor (3.27); pub picks a newer one on newer Flutter.
  audioplayers: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  url_launcher_platform_interface: ^2.3.0   # fake launcher for the link tests

flutter:
  assets:
    # Default incoming-message chime — the same file the web widget serves, so
    # a visitor hears one sound whichever surface they reach support through.
    # Bundled with the package, so hosts declare nothing; a tenant's own
    # `soundUrl` from the widget config takes precedence at play time.
    - assets/sounds/message.mp3
